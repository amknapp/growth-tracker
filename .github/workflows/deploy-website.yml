name: Deploy Website to S3

on:
  push:
    branches:
      - mainline
    paths:
      - 'website/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync files to S3
        run: |
          cd website
          aws s3 sync . s3://growthtrackerapp.com \
            --exclude "*.sh" \
            --exclude "*.ps1" \
            --exclude "*.md" \
            --exclude ".DS_Store" \
            --exclude "bucket-policy.json" \
            --exclude ".gitignore" \
            --cache-control "public, max-age=3600" \
            --delete

      - name: Set cache headers for CSS
        run: |
          aws s3 cp s3://growthtrackerapp.com/styles.css s3://growthtrackerapp.com/styles.css \
            --cache-control "public, max-age=31536000" \
            --content-type "text/css" \
            --metadata-directive REPLACE

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$DISTRIBUTION_ID" ]; then
            echo "Invalidating CloudFront cache..."
            aws cloudfront create-invalidation \
              --distribution-id $DISTRIBUTION_ID \
              --paths "/*"
          else
            echo "Skipping CloudFront invalidation (CLOUDFRONT_DISTRIBUTION_ID secret not set)"
          fi

      - name: Deployment summary
        run: |
          echo "✅ Website deployed to S3"
          echo "📦 Bucket: growthtrackerapp.com"
          echo "🌐 URL: https://growthtrackerapp.com"
